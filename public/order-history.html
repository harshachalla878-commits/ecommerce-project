<!DOCTYPE html>
<html>
<head>
    <title>MyAmazon | Orders</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<div class="navbar">
    <div class="logo">MyAmazon</div>
    <div>
        <a href="order-history.html">📦 Orders</a>
        <a href="cart.html">🛒 Cart</a>
    </div>
</div>

<!-- ===== PAGE CONTENT ===== -->
<div class="container">

<h1>📦 Order History</h1>

<div id="orders"></div>

<br>
<a href="index.html" style="font-weight:bold;">⬅ Back to Shop</a>

</div>

<script>
let orders = JSON.parse(localStorage.getItem("orders")) || [];
const ordersDiv = document.getElementById("orders");

if (orders.length === 0) {
    ordersDiv.innerHTML = "<p>No orders placed yet.</p>";
} else {
    orders.forEach(order => {
        let itemsHTML = "";

        order.items.forEach(item => {
            itemsHTML += `
                <div style="display:flex; gap:15px; margin:10px 0; align-items:center;">
                    <img src="${item.image}"
                         style="width:80px; border-radius:6px;">
                    <div>
                        <p><strong>${item.name}</strong></p>
                        <p>Qty: ${item.qty}</p>
                        <p>₹${item.price * item.qty}</p>
                    </div>
                </div>
            `;
        });

        ordersDiv.innerHTML += `
            <div class="product">
                <h3>Order #${order.id}</h3>
                <p>Date: ${order.date}</p>

                ${itemsHTML}

                <h4>Total Paid: ₹${order.total}</h4>
            </div>
            <br>
        `;
    });
}
</script>

</body>
</html>
